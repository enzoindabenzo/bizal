version: '3.9'

# BizAL — PRODUCTION stack
#
# This is the correct file to use for production deployments.
# docker-compose.yml is the development stack (DEBUG=True, Dockerfile.dev,
# Django runserver). This file:
#   - Builds from the root Dockerfile (gunicorn, non-root user, baked image)
#   - Uses bizal.settings.production (activates all safety guards, requires
#     real SECRET_KEY, enforces DEBUG=False, checks ALLOWED_HOSTS, etc.)
#   - Does NOT hardcode DEBUG=True — value is read from .env (must be absent
#     or "False"; production.py raises ImproperlyConfigured if DEBUG=True)
#   - Mounts media_data into the nginx service so user-uploaded files are served
#
# Usage:
#   cp .env.example .env          # fill in all required secrets
#   docker compose -f docker-compose.prod.yml up -d --build

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=768MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=140
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c log_checkpoints=on
      -c log_min_duration_statement=200
      -c log_lock_waits=on
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bizal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PGBOUNCER FIX: sits between web/spa/celery and Postgres in transaction-
  # pooling mode. Django+gunicorn workers each open their own DB connection;
  # under concurrency that exceeds Postgres's usable connection slots and
  # produces connection resets. PgBouncer multiplexes many client
  # connections onto a small pool of real Postgres connections.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    environment:
      # This image reads DB_HOST/DB_USER/DB_PASSWORD/DB_NAME directly (not
      # DATABASE_HOST etc — that was wrong in an earlier draft of this file).
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      # 2026-09-14 CAPACITY FIX: the 300-user load test's Postgres slow-query
      # log showed trivial queries (PK lookups, bare "SELECT 1") taking
      # 700-2800ms — a sign Postgres itself was CPU-starved, not that any
      # query plan was bad. Root cause: DEFAULT_POOL_SIZE=90 lets pgbouncer
      # hand out up to 90 concurrent server-side connections to Postgres,
      # which is far more than a laptop's real core count (Postgres's own
      # scaling advice is roughly 2-4x cores for concurrently-*executing*
      # backends — everything past that should queue in pgbouncer, not
      # thrash for CPU inside Postgres). The previous note ("90 measured
      # clean") was never actually confirmed against `docker stats` per its
      # own caveat. Lowered to 20 as a safer default for local/laptop
      # hardware; override via DEFAULT_POOL_SIZE in .env once you've
      # confirmed the real deployment host's core count
      # (docker compose exec db nproc) — 2-4x that number is the target.
      DEFAULT_POOL_SIZE: "${PGBOUNCER_POOL_SIZE:-20}"
      QUERY_WAIT_TIMEOUT: "20"
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${DB_USER}
    expose:
      - "5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${DB_PASSWORD} psql -h 127.0.0.1 -p 5432 -U ${DB_USER} -d ${DB_NAME} -c 'SELECT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # DIAGNOSTIC: SYS_PTRACE added so py-spy can attach to gunicorn worker
    # PIDs from inside this container (py-spy dump / py-spy top need ptrace
    # access to inspect another process's stack, which Docker blocks by
    # default). This is only needed for live CPU profiling during load
    # tests — safe to remove once the health-only-run CPU investigation is
    # done, since it does widen the container's syscall surface slightly.
    cap_add:
      - SYS_PTRACE
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    environment:
      TZ: Europe/Tirane
      DJANGO_SETTINGS_MODULE: bizal.settings.production
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      # Reverted to the default 60s. The 600s value was a one-off test to
      # check whether the periodic reconnect storm at 1000 users (failures
      # clustered at t=60s and t=120s) was caused by CONN_MAX_AGE. Keeping
      # it at 60 here so the Postgres-tuning re-run only changes one
      # variable (the db: command above) at a time — test CONN_MAX_AGE=600
      # again later, as its own separate, isolated run.
      DB_CONN_MAX_AGE: "60"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@bizal.al}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bizal.al}
      # Do NOT set DEBUG here — production.py raises ImproperlyConfigured if
      # DEBUG=True is detected. Leave it unset or explicitly "False" in .env.
      # ── AI / Chatbot (OPTIONAL — omit or leave blank to disable chatbot) ──
      # These keys are not interpolated in the YAML above, so Docker
      # Compose would never forward them to the container despite being in .env.
      # With an explicit environment: block, only listed variables are injected.
      GROQ_API_KEY_1: ${GROQ_API_KEY_1:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      GROQ_API_KEY_3: ${GROQ_API_KEY_3:-}
      OPENROUTER_API_KEY_1: ${OPENROUTER_API_KEY_1:-}
      OPENROUTER_API_KEY_2: ${OPENROUTER_API_KEY_2:-}
      OPENROUTER_API_KEY_3: ${OPENROUTER_API_KEY_3:-}
      # ── Monitoring (OPTIONAL) ──
      # Same issue as above — SENTRY_DSN/APP_VERSION must be listed
      # here to reach the container; .env alone is not enough.
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-unknown}
    healthcheck:
      # NOTE: ALLOWED_HOSTS must include 'localhost' and '127.0.0.1' for this to pass.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.28.0.10

  spa:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # With no entrypoint override, Compose falls back to the image's
    # own ENTRYPOINT (/entrypoint.sh), which runs migrate + sync_celery_schedule
    # + collectstatic. web already does all three and spa depends_on web being
    # healthy, so re-running migrate/sync_celery_schedule here is redundant
    # (harmless since both are idempotent, but it wastes startup time).
    # Override the entrypoint so spa only runs collectstatic, then gunicorn.
    #
    # Collectstatic failure (e.g. transient DB blip if any future
    # AppConfig.ready() queries the DB, or a missing STATICFILES_DIRS entry)
    # previously caused the `&&` chain to exit non-zero, the spa container to
    # exit immediately, its health check to never fire, and nginx
    # (depends_on: spa: service_healthy) to wait indefinitely — stalling the
    # entire prod stack with no obvious error. `|| true` promotes a collectstatic
    # failure to a warning: the error is printed to the container log but gunicorn
    # still starts. spa runs its own collectstatic — web and spa do NOT share a
    # staticfiles volume; each container has its own /app/staticfiles. Both
    # build from the same image so content is identical; running collectstatic
    # independently in each container is correct and intentional.
    # Exec-form list eliminates double-shell.
    # A YAML folded scalar (>) produces a *string* command; Docker Compose always
    # wraps a string command in /bin/sh -c "...", so entrypoint:[] + string command
    # still gave: /bin/sh -c "sh -c '...'". exec gunicorn replaced only the inner
    # sh; the outer /bin/sh survived as PID 1's child and intercepted SIGTERM on
    # docker stop, adding latency and reducing shutdown reliability.
    # Exec-form (a YAML list) passes ["sh","-c","..."] directly to the runtime with
    # no shell wrapping; exec gunicorn then replaces sh as PID 1.
    entrypoint: []
    command:
      - "sh"
      - "-c"
      - |-
        python manage.py collectstatic --noinput;
        STATIC_EXIT=$$?;
        if [ $$STATIC_EXIT -ne 0 ]; then
          echo "CRITICAL: collectstatic exited with code $$STATIC_EXIT -- static files may be stale or missing. Check STATICFILES_DIRS and volume mounts." >&2;
          echo "COLLECTSTATIC_FAILED=1" >&2;
          python -c "
        import os, sys
        try:
            import sentry_sdk
            sentry_sdk.init(
                dsn=os.environ.get('SENTRY_DSN', ''),
                environment='production',
                release=os.environ.get('APP_VERSION', 'unknown'),
            )
            sentry_sdk.capture_message('collectstatic failed at startup', level='error')
            sentry_sdk.flush()
        except Exception:
            pass
        " 2>/dev/null || true;
        fi;
        # LOGGING FIX: same reasoning as web's gunicorn command in
        # entrypoint.sh — no access/error log or log-level was previously
        # set here either, so spa's container logs were just as empty.
        # CAPACITY FIX (200-user load test, 2026-09-10): spa was hardcoded to
        # --workers 2 --threads 2 (4 request slots total). nginx.conf routes
        # every tenant-subdomain request (Host: <slug>.bizal.al) to spa, not
        # web — and the load test's own traffic mix (locustfile.py user
        # weights: ReadHeavyTenantUser=8, WriteHeavyTenantUser=2,
        # AuthenticatedCustomerUser=2, TenantOwnerUser=1 vs
        # AdminPlatformUser=1 on main domain) puts ~90% of all requests on
        # tenant subdomains. Measured split in
        # backend/run_200u_docker_real_pgbouncer_stats.csv: 9,262 of 10,279
        # tagged requests (90.1%) were [tenant] (-> spa), only 1,017 (9.9%)
        # were [main domain] (-> web). With only 4 slots absorbing 90% of
        # 200 concurrent users, gunicorn's listen backlog filled almost
        # immediately and nginx got connection-refused from spa — that's
        # why failures were FAST (5-8ms median) rather than slow timeouts:
        # a 502 in single-digit ms is nginx failing to connect upstream, not
        # a slow backend. This produced 10,288/11,227 failures (91.6%) in
        # that run, concentrated almost entirely on [tenant] endpoints while
        # [main domain] endpoints (served by web's dynamic nproc-based
        # sizing) mostly succeeded. (The one main-domain exception,
        # check-slug's 78 failures, is a separate, expected artifact: that
        # view is rate-limited 10/min per IP and Locust hits it from a
        # single source IP — not a capacity bug.)
        # FIX: size spa the same way web already does (2×cores+1, since the
        # workload is I/O-bound waiting on Postgres — see WORKER COUNT FIX
        # comment in entrypoint.sh), instead of a number picked with no
        # relation to spa's actual share of traffic. GUNICORN_SPA_WORKERS /
        # GUNICORN_SPA_THREADS override this if real-hardware measurement
        # (Railway dashboard -> Metrics, or a re-run of this same load test)
        # shows spa needs a different ratio than web — given spa carries 9x
        # web's request volume, it will very likely need MORE than 2×cores+1
        # once tested on real multi-core hardware; treat this as the fix for
        # the "4 slots total" bug, not a final tuned number.
        # COMPOSE-ESCAPING FIX: every $$ below (and every $$ above, e.g.
        # $$STATIC_EXIT/$$?) must be written doubled in this file. This
        # command block is inline YAML in docker-compose.prod.yml, not a
        # separate script file like entrypoint.sh — Compose runs its OWN
        # variable interpolation over the whole file (matching $$VAR/$${VAR}
        # patterns, including inside comments) before the shell ever sees
        # this string. A single $ here gets silently replaced by Compose
        # itself (with a "variable is not set, defaulting to blank string"
        # warning), never reaches the shell as a $, and the shell then sees
        # an empty string instead of the runtime value. That's what broke
        # the first version of this fix: $$SPA_WORKERS / $$SPA_THREADS
        # resolved to '' before gunicorn ever started, and the pre-existing
        # $$STATIC_EXIT/$$? references above had the same problem (silently
        # — STATIC_EXIT was always blank, so the collectstatic-failure check
        # never actually fired; harmless before since the old gunicorn line
        # used literal numbers, not a variable). Doubling the $ tells
        # Compose "leave this dollar sign alone", producing a single real $
        # in the string the shell receives.
        SPA_WORKERS=$${GUNICORN_SPA_WORKERS:-$$(( $$(nproc) * 2 + 1 ))};
        SPA_THREADS=$${GUNICORN_SPA_THREADS:-4};
        exec gunicorn bizal.wsgi:application --preload --bind 0.0.0.0:8001 --workers "$$SPA_WORKERS" --threads "$$SPA_THREADS" --timeout 120 --keep-alive 75 \
          --access-logfile - --error-logfile - --capture-output --log-level info \
          --access-logformat '%(t)s %(h)s "%(r)s" %(s)s %(b)s %(D)sus'
    volumes:
      - media_data:/app/media
    expose:
      - "8001"
    environment:
      TZ: Europe/Tirane
      DJANGO_SETTINGS_MODULE: bizal.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@bizal.al}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bizal.al}
      # Chatbot API keys (same fix as web service above).
      GROQ_API_KEY_1: ${GROQ_API_KEY_1:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      GROQ_API_KEY_3: ${GROQ_API_KEY_3:-}
      OPENROUTER_API_KEY_1: ${OPENROUTER_API_KEY_1:-}
      OPENROUTER_API_KEY_2: ${OPENROUTER_API_KEY_2:-}
      OPENROUTER_API_KEY_3: ${OPENROUTER_API_KEY_3:-}
      # Monitoring (same fix as web service above).
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-unknown}
      # GUNICORN SIZING FIX: same "environment: block is a strict allowlist"
      # gotcha documented above for GROQ_*/OPENROUTER_*/SENTRY_DSN — having
      # GUNICORN_SPA_WORKERS/GUNICORN_SPA_THREADS in .env does nothing on
      # its own; Compose only forwards variables explicitly listed here.
      # Without this, spa's startup command (see command: block above)
      # always falls through to its nproc-based default and the override
      # silently never reaches the container — confirmed by a 200-user
      # test where nproc*2+1 (17 workers) oversubscribed the Docker Desktop
      # VM badly enough that even the Docker Engine API itself stopped
      # responding. Defaulted to empty string (not a number) so the
      # shell's own ${GUNICORN_SPA_WORKERS:-...} default still applies
      # when unset, exactly like every other optional var in this block.
      GUNICORN_SPA_WORKERS: ${GUNICORN_SPA_WORKERS:-}
      GUNICORN_SPA_THREADS: ${GUNICORN_SPA_THREADS:-}
    healthcheck:
      # NOTE: ALLOWED_HOSTS must include 'localhost' and '127.0.0.1' for this to pass.
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.28.0.11

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Bypass /entrypoint.sh so celery workers don't run migrate +
    # sync_celery_schedule + collectstatic on every restart. Those steps are
    # handled by `web` (which celery implicitly depends on via the beat service).
    # celery workers serve no static files and need no DB schema changes of their own.
    entrypoint: []
    command: ["celery", "-A", "bizal", "worker", "--loglevel=info", "--concurrency=2"]
    # Removed `media_data:/app/media` mount. Celery tasks in this
    # codebase only send emails, update DB rows, and call external APIs — they
    # never read or write media files. The mount was an unnecessary shared
    # volume dependency and needlessly gave a compromised task write access
    # to the user-upload directory.
    environment:
      TZ: Europe/Tirane
      DJANGO_SETTINGS_MODULE: bizal.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CELERY_WORKER_RUNNING: "true"
      # Production.py iterates ALLOWED_HOSTS at import time for the
      # glob-syntax guard. Include it for consistency and future-safety.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      # Production.py raises ImproperlyConfigured at import time if
      # FRONTEND_BASE_URL is absent. Without this both Celery processes crash on
      # startup and no async tasks ever run in production.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      # Email tasks call send_mail(fail_silently=False). Without
      # these, SMTP auth fails and tasks are permanently lost after 3 retries.
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@bizal.al}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bizal.al}
      # Forward Sentry DSN so exceptions in Celery tasks are tracked.
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-unknown}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      web:
        condition: service_healthy # guarantees migrate + sync_celery_schedule have run; not transitive via beat

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Bypass /entrypoint.sh (same reasoning as celery service above).
    # celery-beat depends_on web: service_healthy, guaranteeing migrate +
    # sync_celery_schedule have already completed before beat starts.
    entrypoint: []
    command: ["celery", "-A", "bizal", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    # Removed `media_data:/app/media` mount — see celery worker
    # service above for rationale; celery-beat never touches media files.
    environment:
      TZ: Europe/Tirane
      DJANGO_SETTINGS_MODULE: bizal.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CELERY_WORKER_RUNNING: "true"
      # Include ALLOWED_HOSTS for consistency and future-safety.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      # Production.py raises ImproperlyConfigured at import time if
      # FRONTEND_BASE_URL is absent. Without this both Celery processes crash on
      # startup and no async tasks ever run in production.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      # Email tasks call send_mail(fail_silently=False). Without
      # these, SMTP auth fails and tasks are permanently lost after 3 retries.
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@bizal.al}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bizal.al}
      # Forward Sentry DSN so beat-scheduled task failures are tracked.
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-unknown}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      # Celery-beat uses DatabaseScheduler, which reads the
      # django_celery_beat_periodictask table. The `web` service runs
      # `sync_celery_schedule` in entrypoint.sh (after migrate) to seed that
      # table from CELERY_BEAT_SCHEDULE. If celery-beat starts before `web`
      # finishes sync_celery_schedule, the table is empty and no periodic
      # tasks fire — including trial expiry, reminders, and analytics cleanup.
      # Waiting for `web` to be healthy guarantees migrate + sync have run.
      web:
        condition: service_healthy

  db-backup:
    build:
      context: ./docker/db-backup
    restart: unless-stopped
    environment:
      TZ: Europe/Tirane
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}
      BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-}
    volumes:
      - postgres_backups:/backups
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount media volume so nginx serves /media/ directly.
      # production.py sets DEBUG=False so Django's static() helper never
      # registers a /media/ route; nginx must serve these files itself.
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
      spa:
        condition: service_healthy
    healthcheck:
      # See docker-compose.yml — bare "localhost" Host header
      # never matches nginx's server_name, healthcheck would always fail.
      test: ["CMD", "curl", "-f", "-H", "Host: bizal.al", "http://localhost/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
  media_data:
  postgres_backups:

networks:
  # STATIC-IP FIX (network reliability): web/spa are pinned to fixed
  # addresses below so nginx can use a real `upstream {}` block with
  # `keepalive` (see nginx.conf) instead of resolving their hostname fresh
  # on every single proxied request. Per-request DNS resolution was added
  # earlier to survive container recreates changing the backend's IP, but
  # it also meant nginx opened a brand-new TCP connection to spa/web for
  # every proxied request instead of reusing a small pool — a large source
  # of extra connection churn on the Docker bridge network under load.
  # Pinning IPs gets both: recreate-safety (the IP never changes) and
  # connection reuse (nginx can keep upstream sockets open via keepalive).
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16